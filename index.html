<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>谁玩谁牛逼 · 下水道大冒险</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#0e1210; touch-action:none;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #stage { position:fixed; top:0; left:0; width:100vw; height:100vh; overflow:hidden; }
  #stage canvas { display:block; width:100%; height:100%; }

  /* 触屏按钮（放进 #stage，随画面一起旋转） */
  .btn { position:absolute; z-index:20; border:none; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; opacity:.72; user-select:none;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.25); }
  .btn:active { opacity:.95; transform:scale(.94); }
  #bL  { left:18px;  bottom:96px; width:64px; height:64px; background:#4a7dff; font-size:28px; }
  #bR  { left:98px;  bottom:96px; width:64px; height:64px; background:#4a7dff; font-size:28px; }
  #bJump { right:24px; bottom:150px; width:84px; height:84px; background:#ff7ab0; font-size:22px; }
  #bCrouch { right:34px; bottom:46px; width:64px; height:64px; background:#8a6bd0; font-size:20px; }
  #bTaunt { right:20px; bottom:260px; width:70px; height:70px; background:#ffb56b; font-size:17px; }

  /* 竖屏时把整个画面旋转 90°，玩家自然横过来玩 */
  @media (orientation: portrait) {
    #stage {
      width:100vh; height:100vw;
      transform:rotate(90deg);
      transform-origin:top left;
      top:0; left:100vw;
    }
  }

  /* 覆盖层 */
  .overlay { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:rgba(10,14,12,.82); color:#fff; }
  .overlay h1 { font-size:34px; letter-spacing:2px; margin-bottom:10px; }
  .overlay p { font-size:16px; line-height:1.9; color:#cfe8d8; max-width:520px; }
  .overlay .big { font-size:40px; margin-top:16px; }
  #startBtn { margin-top:26px; padding:14px 40px; font-size:20px; font-weight:800;
    border:none; border-radius:40px; background:#ffd93d; color:#5a3b00; box-shadow:0 6px 20px rgba(255,217,61,.4); }
  #levelList { display:flex; flex-direction:column; gap:14px; margin-top:16px; }
  .levelBtn { padding:16px 60px; font-size:24px; font-weight:800; border:none; border-radius:16px;
    background:#ff7ab0; color:#fff; box-shadow:0 6px 18px rgba(255,122,176,.4); cursor:pointer; }
  .levelBtn:active { transform:scale(.96); }
  .ghostBtn { margin-top:22px; padding:12px 26px; font-size:16px; font-weight:800; cursor:pointer;
    border:2px solid #8a6bd0; border-radius:40px; background:rgba(255,255,255,.1); color:#d9c8ff; }
  #nameInput { margin-top:16px; padding:12px 16px; width:230px; font-size:18px; text-align:center;
    border:2px solid #8a6bd0; border-radius:14px; background:rgba(255,255,255,.92); color:#333; outline:none; }
  #avatarPick { display:flex; justify-content:center; margin-top:12px; }
  .avatar { width:96px; height:96px; border-radius:50%; overflow:hidden; cursor:pointer;
    border:3px solid #ffd93d; background:#fff; box-shadow:0 0 0 3px rgba(255,217,61,.4); }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  #hint { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); z-index:15;
    color:#9fb8a8; font-size:12px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="btn" id="bL">◀</div>
  <div class="btn" id="bR">▶</div>
  <div class="btn" id="bJump">跳</div>
  <div class="btn" id="bCrouch">蹲</div>
  <div class="btn" id="bTaunt">嘲讽</div>
</div>
<div id="hint">键盘：←→ 移动 · ↑/空格 跳 · ↓/C 蹲</div>
<button id="bMute" style="position:fixed; top:14px; right:14px; z-index:25; width:48px; height:48px; border-radius:50%; border:none; background:rgba(0,0,0,.45); color:#fff; font-size:22px; line-height:1;">🔊</button>
<button id="backBtn" style="position:fixed; top:14px; left:14px; z-index:25; width:60px; height:42px; border-radius:12px; border:none; background:rgba(0,0,0,.5); color:#fff; font-size:16px; font-weight:800;">返回</button>

<div class="overlay" id="homeScreen">
  <h1>💩 谁玩谁牛逼 💩</h1>
  <p style="color:#9fb8a8; margin-bottom:6px;">选个关卡，开跑！</p>
  <div id="levelList">
    <button class="levelBtn" data-level="1">第一关</button>
    <button class="levelBtn" data-level="2">第二关</button>
  </div>
  <button id="switchHeroBtn" class="ghostBtn">🔄 切换英雄（重输名字/头像）</button>
</div>

<div class="overlay" id="startScreen" style="display:none">
  <h1>💩 谁玩谁牛逼 💩</h1>

'use strict';
/* ============ 画布 & 缩放 ============ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const VIEW_W = 960, VIEW_H = 540;
const WORLD_W = 6300, WORLD_H = 1000;

let scale = 1, offX = 0, offY = 0;
function resize() {
  let w = innerWidth, h = innerHeight;
  if (w < h) [w, h] = [h, w];   // 竖屏时 #stage 被旋转，画布用横屏尺寸
  cvs.width = w; cvs.height = h;
  scale = Math.min(w / VIEW_W, h / VIEW_H);
  offX = (w - VIEW_W * scale) / 2;
  offY = (h - VIEW_H * scale) / 2;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();

/* ============ 常量 ============ */
const GRAV = 0.65, MOVE = 4.4, JUMP = -13.5, MAX_FALL = 16;
const STAND_H = 62, CROUCH_H = 40, PW = 52;

/* ============ 输入 ============ */
const keys = {};
let prevJump = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k)) e.preventDefault();
  keys[k] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 触屏按钮 -> 复用 keys
function bind(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; };
  const off = e => { e.preventDefault(); keys[key] = false; };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bind('bL', 'arrowleft');
bind('bR', 'arrowright');
bind('bJump', 'arrowup');
bind('bCrouch', 'arrowdown');

function loadLevel(n) {
  currentLevel = n;
  const L = LEVELS[n];
  platforms = L.platforms;
  finish = L.finish;
  spawn = L.spawn;
  rats = L.rats.map(r => ({ x:r.x, ox:r.x, w:r.w, h:r.h, speed:r.speed, dir:-1, platform: platforms[r.pi], y: platforms[r.pi].y - r.h }));
  traps = (L.traps || []).map(t => ({ ...t }));
  hasTrap = false;
  danmu = [];
  reset();
}

const INSULTS = ['你是猪吗', '拉完了', '老弟你在用脚玩吗', '菜', '狗都看笑了', '多吃点核桃', '你急了', '你别急', '谁能绷住'];

/* ============ 玩家 ============ */
const player = {
  x:80, y:620 - STAND_H, vx:0, vy:0, w:PW, h:STAND_H,
  facing:1, onGround:false, jumps:0, crouching:false, squash:1,
};

/* ============ 状态 ============ */
let state = 'home';       // home | setup | play | dead | win
let deadTimer = 0;
let insult = '';
let playerName = '羊咩咩';
let particles = [];
let cam = { x:0, y:0 };
let animFrame = 0;        // 动画帧计数
let tauntTimer = 0;       // >0 时跳舞嘲讽

function reset() {
  player.x = spawn.x; player.y = spawn.y - STAND_H; player.vx = 0; player.vy = 0;
  player.h = STAND_H; player.facing = 1; player.onGround = false; player.jumps = 0;
  player.crouching = false; player.squash = 1;
  rats.forEach(r => { r.x = r.ox; r.dir = -1; r.y = r.platform.y - r.h; });
  particles = [];
  tauntTimer = 0;
  state = 'play';
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ============ 物理 ============ */
function overlaps(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function catchByRat() {
  insult = playerName + '，' + INSULTS[Math.floor(Math.random()*INSULTS.length)];
  document.getElementById('insultText').textContent = insult;
  document.getElementById('deadScreen').style.display = 'flex';
  state = 'dead'; deadTimer = 90;   // 约1.5秒后重开
}

function update() {
  if (state === 'home' || state === 'setup' || state === 'win') return;
  if (state === 'dead') {
    if (--deadTimer <= 0) { document.getElementById('deadScreen').style.display='none'; reset(); }
    return;
  }

  // 蹲
  const crouch = keys['arrowdown'] || keys['c'] || keys['control'] || keys['shift'];
  const newH = crouch ? CROUCH_H : STAND_H;
  if (newH !== player.h) { player.y += player.h - newH; player.h = newH; }
  player.crouching = crouch;

  // 跳（二段跳）
  const jumpNow = keys['arrowup'] || keys['w'] || keys[' '];
  if (jumpNow && !prevJump && player.jumps < 2) {
    player.vy = JUMP; player.jumps++; player.onGround = false; player.squash = 1.28;
  }
  prevJump = jumpNow;

  // 水平
  let dir = 0;
  if (keys['arrowleft'] || keys['a']) dir -= 1;
  if (keys['arrowright'] || keys['d']) dir += 1;
  player.vx = dir * MOVE;
  if (dir !== 0) player.facing = dir;
  player.x += player.vx;
  player.x = clamp(player.x, 0, WORLD_W - player.w);
  for (const p of platforms) {
    if (overlaps(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
      player.vx = 0;
    }
  }

  // 垂直
  player.vy += GRAV;
  if (player.vy > MAX_FALL) player.vy = MAX_FALL;
  const prevBottom = player.y + player.h;
  player.y += player.vy;
  player.onGround = false;
  for (const p of platforms) {
    if (!overlaps(player, p)) continue;
    if (player.vy >= 0 && prevBottom <= p.y + player.vy + 1) {
      player.y = p.y - player.h; player.vy = 0; player.onGround = true;
    } else if (player.vy < 0) {
      player.y = p.y + p.h; player.vy = 0;
    }
  }
  if (player.onGround) player.jumps = 0;

  // 掉进污水
  if (player.y > 900) { catchByRat(); return; }

  // 收集老鼠夹
  for (let i = traps.length - 1; i >= 0; i--) {
    const t = traps[i];
    const tpx = player.x + player.w/2, tpy = player.y + player.h/2;
    if ((tpx - t.x)**2 + (tpy - t.y)**2 < 34*34) {
      traps.splice(i, 1);
      hasTrap = true;
      burst(t.x, t.y, '#ffd93d');
    }
  }

  // 老鼠
  for (let i = rats.length - 1; i >= 0; i--) {
    const r = rats[i];
    const rx = r.x + r.w/2, px = player.x + player.w/2;
    const playerOnThis = Math.abs((player.y + player.h) - r.platform.y) < 14
                      && player.x + player.w > r.platform.x - 20
                      && player.x < r.platform.x + r.platform.w + 20;
    if (playerOnThis && Math.abs(px - rx) < 560) r.dir = px > rx ? 1 : -1;
    r.x += r.dir * r.speed;
    if (r.x < r.platform.x) { r.x = r.platform.x; r.dir = 1; }
    if (r.x + r.w > r.platform.x + r.platform.w) { r.x = r.platform.x + r.platform.w - r.w; r.dir = -1; }
    if (overlaps(player, r)) {
      if (hasTrap) {
        // 老鼠夹夹死老鼠！
        rats.splice(i, 1);
        hasTrap = false;
        showDanmu('你用老鼠夹夹死了这只老鼠，你真牛逼');
        burst(r.x + r.w/2, r.y + r.h/2, '#ff7ab0');
        continue;
      } else {
        catchByRat(); return;
      }
    }
  }

  // 终点
  const fx = finish.x, fy = finish.y - finish.r/2;
  const pxx = player.x + player.w/2, pyy = player.y + player.h/2;
  if ((pxx-fx)**2 + (pyy-fy)**2 < (finish.r+12)**2) {
    document.getElementById('winScreen').style.display = 'flex';
    state = 'win';
  }

  player.squash += (1 - player.squash) * 0.18;
  animFrame++;
  if (tauntTimer > 0) tauntTimer--;
  updateParticles();
  updateDanmu();
  updateCamera();
}

function updateCamera() {
  const tx = clamp(player.x - VIEW_W*0.40, 0, WORLD_W - VIEW_W);
  const ty = clamp(player.y - VIEW_H*0.55, 0, WORLD_H - VIEW_H);
  cam.x += (tx - cam.x) * 0.12;
  cam.y += (ty - cam.y) * 0.12;
}
function updateParticles() {
  for (let i = particles.length-1; i>=0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
}
function burst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random()*Math.PI*2, sp = 1 + Math.random()*3;
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.5, life:30, color });
  }
}
function showDanmu(text) {
  danmu.push({ text, x: cvs.width, y: 60 + Math.random()*50, life: 320 });
}
function updateDanmu() {
  for (let i = danmu.length-1; i>=0; i--) {
    const d = danmu[i]; d.x -= 2.4; d.life--;
    if (d.life <= 0 || d.x < -600) danmu.splice(i,1);
  }
}

/* ============ 绘制 ============ */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawBackground() {
  // 背景1 图片铺满全屏
  if (bgImg.complete && bgImg.naturalWidth > 0) {
    ctx.drawImage(bgImg, 0, 0, VIEW_W, VIEW_H);
  } else {
    const g = ctx.createLinearGradient(0,0,0,VIEW_H);
    g.addColorStop(0,'#2b3a2e'); g.addColorStop(.5,'#1c2820'); g.addColorStop(1,'#0e1410');
    ctx.fillStyle = g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  }
  // 底部污水（死亡区示意）
  ctx.save();
  ctx.globalAlpha = .85;
  ctx.fillStyle = '#3f6b2a';
  ctx.fillRect(0, 900 - cam.y, VIEW_W, 100 + cam.y);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawPlatform(p) {
  const x = p.x - cam.x, y = p.y - cam.y;
  if (p.kind === 'poop') {
    rr(x, y, p.w, p.h, 16); ctx.fillStyle='#8a5a33'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#5a3a1e'; ctx.stroke();
    ctx.font = (p.h+14)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('💩', x+p.w/2, y+p.h/2 - 1);
  } else if (p.kind === 'pipe') {
    rr(x, y, p.w, p.h, 12); ctx.fillStyle='#4f7a4f'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#2f4a2f'; ctx.stroke();
    rr(x+6, y-6, p.w-12, 8, 4); ctx.fillStyle='#6a9a6a'; ctx.fill();
  } else if (p.kind === 'garbage') {
    rr(x, y, p.w, p.h, 10); ctx.fillStyle='#3a4a2a'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#1f2a1a'; ctx.stroke();
    ctx.font='34px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🗑️', x+p.w/2, y+p.h/2);
  } else { // ground
    rr(x, y, p.w, p.h, 6); ctx.fillStyle='#6a7a68'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#3a4a3a'; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(x+8, y+5, p.w-16, 8);
  }
}

function drawRat(r) {
  const x = r.x - cam.x, y = r.y - cam.y;
  const s = r.dir;   // 朝向
  ctx.save();
  ctx.translate(x + r.w/2, y + r.h/2);
  ctx.scale(s, 1);
  // 尾巴
  ctx.strokeStyle='#d88'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-18, 4); ctx.quadraticCurveTo(-34, 12, -40, 2); ctx.stroke();
  // 身体
  ctx.fillStyle='#9a9a94';
  ctx.beginPath(); ctx.ellipse(0, 0, 20, 13, 0, 0, 7); ctx.fill();
  // 头
  ctx.fillStyle='#b0b0a8';
  ctx.beginPath(); ctx.arc(16, -4, 11, 0, 7); ctx.fill();
  // 耳朵
  ctx.fillStyle='#e8a0b0';
  ctx.beginPath(); ctx.arc(12, -14, 5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(20, -15, 5, 0, 7); ctx.fill();
  // 眼睛
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(20, -5, 2, 0, 7); ctx.fill();
  ctx.restore();
}

function drawFinish() {
  const x = finish.x - cam.x, y = finish.y - cam.y;
  const t = performance.now()/300;
  ctx.save();
  ctx.translate(x, y - finish.r/2);
  ctx.globalAlpha = .3 + Math.sin(t)*.2;
  ctx.beginPath(); ctx.arc(0,0, finish.r+8, 0, 7); ctx.fillStyle='#ffd93d'; ctx.fill();
  ctx.globalAlpha = 1;
  ctx.font='40px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🚪', 0, 0);
  ctx.restore();
}

function drawTraps() {
  for (const t of traps) {
    const x = t.x - cam.x, y = t.y - cam.y;
    const b = Math.sin(performance.now()/250) * 3;
    ctx.save();
    ctx.translate(x, y + b);
    ctx.globalAlpha = .5 + Math.sin(performance.now()/250)*.2;
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.strokeStyle='#ffd93d'; ctx.lineWidth=2; ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = '30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🪤', 0, 0);
    ctx.restore();
  }
}

function drawLimb(x1, y1, x2, y2, color, w) {
  ctx.strokeStyle = color || '#33343c';
  ctx.lineWidth = w || 5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function drawHead(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.clip();
  ctx.rotate(rot || 0);
  if (headSprite.complete && headSprite.naturalWidth > 0) {
    ctx.drawImage(headSprite, -r, -r, r*2, r*2);
  } else {
    ctx.fillStyle = '#ffd93d'; ctx.fillRect(-r, -r, r*2, r*2);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.lineWidth = 3; ctx.strokeStyle = '#222'; ctx.stroke();
}

function drawPlayer() {
  const p = player;
  // 姿态：dance > crouch > jump > run > idle
  let pose = 'idle';
  if (tauntTimer > 0) pose = 'dance';
  else if (p.crouching) pose = 'crouch';
  else if (!p.onGround) pose = 'jump';
  else if (Math.abs(p.vx) > 0.1) pose = 'run';
  const ph = animFrame;

  ctx.save();
  ctx.translate(p.x + p.w/2 - cam.x, p.y + p.h - cam.y);   // 脚底中心
  ctx.scale(p.facing * 1.3, 1.3);                          // 整个火柴人放大 1.3 倍

  let hipY, shoY, headY, headR, headRot, fl, fr, hl, hr;
  if (pose === 'crouch') {
    hipY = -12; shoY = -20; headY = -26; headR = 17; headRot = 0;
    fl = [-8, 0]; fr = [8, 0]; hl = [-13, -10]; hr = [13, -10];
  } else if (pose === 'jump') {
    hipY = -16; shoY = -24; headY = -40; headR = 20; headRot = 0;
    fl = [-10, -6]; fr = [10, -6]; hl = [-11, -44]; hr = [11, -44];
  } else if (pose === 'dance') {
    const w = Math.sin(ph * 0.25);
    hipY = -14 + w*2; shoY = -22 + w*3; headY = -40 + w*4; headR = 20;
    headRot = Math.sin(ph * 0.3) * 0.9 + (Math.floor(ph/14)%2 ? 0.25 : -0.25);
    fl = [-8, 0]; fr = [8, 0];
    hl = [-15 - w*6, -32 + w*6]; hr = [15 + w*6, -32 - w*6];
  } else {
    const run = pose === 'run';
    const swing = run ? Math.sin(ph * 0.35) : 0;
    const bob = run ? Math.abs(Math.sin(ph * 0.35)) * 2 : Math.sin(ph * 0.06) * 1;
    hipY = -14 - bob; shoY = -22 - bob; headY = -40 - bob; headR = 20;
    headRot = run ? Math.sin(ph * 0.35) * 0.05 : 0;
    const ls = run ? swing * 8 : 0;
    const as = run ? -swing * 8 : 0;
    fl = [-7 - ls, 0]; fr = [7 + ls, 0];
    hl = [-12 + as, -14]; hr = [12 - as, -14];
  }

  const c = '#33343c';
  drawLimb(0, hipY, fl[0], fl[1], c, 6);   // 左腿
  drawLimb(0, hipY, fr[0], fr[1], c, 6);   // 右腿
  drawLimb(0, shoY, hl[0], hl[1], c, 6);   // 左臂
  drawLimb(0, shoY, hr[0], hr[1], c, 6);   // 右臂
  drawLimb(0, shoY, 0, hipY, c, 9);        // 身体（更粗）
  drawHead(0, headY, headR, headRot);      // 头（更大）
  if (hasTrap) {                            // 头顶显示老鼠夹
    ctx.font = '22px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🪤', 0, headY - headR - 15);
  }

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life/30; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x-cam.x, p.y-cam.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDanmu() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.textAlign = 'left';
  ctx.font = 'bold 24px sans-serif';
  for (const d of danmu) {
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(d.text, d.x, d.y);
    ctx.fillStyle = '#ffd93d';
    ctx.fillText(d.text, d.x, d.y);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  drawBackground();
  for (const p of platforms) drawPlatform(p);
  drawFinish();
  drawTraps();
  for (const r of rats) drawRat(r);
  drawParticles();
  drawPlayer();
  drawDanmu();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* ============ 背景音乐（Web Audio 合成 8-bit 循环） ============ */
let audioCtx = null, musicTimer = null, musicOn = false;

function noteFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

function playTone(freq, t, dur, type, vol) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

// 滑稽滑音：mul<1 下滑(哇呜)，mul>1 上滑(boing)
function playSlide(freq, t, dur, vol, mul) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * mul, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

// 低音"嘣"（放屁式闷响，贴合粑粑主题）
function playBwomp(t, vol) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(55, t + 0.18);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.25);
}

// 更搞怪的循环（马戏团 + boing + 放屁 + 三连哇呜）
const MELODY = [72,76,79,84, 79,76,72,74,  76,72,69,72, 74,0,76,0,
                72,76,79,84, 79,76,72,74,  71,69,67,69, 64,0,67,0];
const BASS   = [48,48,60,48, 55,55,67,55,  45,45,57,45, 50,50,62,50,
                48,48,60,48, 55,55,67,55,  43,43,55,43, 41,41,53,41];
const STEP = 0.14;

function scheduleLoop(t0) {
  const n = MELODY.length;
  for (let i = 0; i < n; i++) {
    const t = t0 + i * STEP;
    if (MELODY[i]) playTone(noteFreq(MELODY[i]), t, STEP * 0.92, 'square', 0.045);
    playTone(noteFreq(BASS[i]), t, STEP * 0.95, 'triangle', 0.08);
  }
  // 搞笑点缀
  playSlide(noteFreq(60), t0 + 3*STEP, STEP*0.45, 0.05, 2.0);      // boing 上滑
  playSlide(noteFreq(76), t0 + 19*STEP, STEP*0.45, 0.05, 2.0);     // boing 上滑
  playBwomp(t0 + 12*STEP, 0.10);                                    // 放屁"嘣"
  for (let k = 0; k < 3; k++) {
    playSlide(noteFreq(67 - k*3), t0 + (n - 6 + k)*STEP, STEP*1.1, 0.05, 0.5); // 哇呜×3
  }
  return t0 + n * STEP;
}

function startMusic() {
  if (musicOn) return;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e) { return; }
  if (audioCtx.resume) audioCtx.resume();
  musicOn = true;
  let next = audioCtx.currentTime + 0.1;
  const tick = () => { while (next < audioCtx.currentTime + 0.8) next = scheduleLoop(next); };
  tick();
  musicTimer = setInterval(tick, 250);
}

function toggleMute() {
  if (!audioCtx) { startMusic(); return; }
  if (audioCtx.state === 'running') audioCtx.suspend();
  else audioCtx.resume();
  document.getElementById('bMute').textContent = (audioCtx.state === 'running') ? '🔊' : '🔇';
}

/* ============ 页面切换 ============ */
function hideAllOverlays() {
  ['homeScreen','startScreen','deadScreen','winScreen'].forEach(s => document.getElementById(s).style.display = 'none');
}
function showHome() {
  hideAllOverlays();
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('backBtn').style.display = 'none';
  state = 'home';
}
function showSetup() {
  hideAllOverlays();
  document.getElementById('startScreen').style.display = 'flex';
  document.getElementById('backBtn').style.display = 'none';
  state = 'setup';
}
function startLevel(n) {
  hideAllOverlays();
  document.getElementById('backBtn').style.display = 'flex';
  startMusic();
  loadLevel(n);
}

/* ============ 启动 ============ */
// 上传头像
document.getElementById('avatarBtn').addEventListener('click', () => {
  document.getElementById('avatarFile').click();
});
document.getElementById('avatarFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    headSprite.src = reader.result;
    document.getElementById('avatarPreview').src = reader.result;
  };
  reader.readAsDataURL(f);
});
// 嘲讽键：跳舞 + 头像转
document.getElementById('bTaunt').addEventListener('click', () => {
  if (state === 'play') tauntTimer = 70;
});
// 首页：选关卡
document.querySelectorAll('.levelBtn').forEach(b => {
  b.addEventListener('click', () => startLevel(parseInt(b.dataset.level, 10)));
});
// 切换英雄
document.getElementById('switchHeroBtn').addEventListener('click', () => {
  document.getElementById('nameInput').value = (playerName === '羊咩咩' ? '' : playerName);
  showSetup();
});
// 保存名字并返回首页
document.getElementById('startBtn').addEventListener('click', () => {
  playerName = (document.getElementById('nameInput').value || '').trim() || '羊咩咩';
  showHome();
});
// 返回首页
document.getElementById('backBtn').addEventListener('click', showHome);
// 静音
document.getElementById('bMute').addEventListener('click', toggleMute);
// 通关后点击返回首页
document.getElementById('winScreen').addEventListener('click', () => {
  document.getElementById('winScreen').style.display = 'none';
  showHome();
});

showHome();
loop();
</script>
